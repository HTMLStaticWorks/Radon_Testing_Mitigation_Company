<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1E28"/>
      <stop offset="60%" stop-color="#17252B"/>
      <stop offset="100%" stop-color="#1A3040"/>
    </linearGradient>
    <radialGradient id="deviceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4D9694" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#17252B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17252B"/>
      <stop offset="100%" stop-color="#0A1820"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="blurSm">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg)"/>

  <!-- Grid lines background -->
  <g stroke="#2D414B" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="500" x2="900" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
  </g>

  <!-- Device ambient glow -->
  <ellipse cx="450" cy="310" rx="220" ry="180" fill="url(#deviceGlow)"/>

  <!-- MAIN MONITOR DEVICE BODY -->
  <rect x="280" y="150" width="340" height="310" fill="#1E2E38" rx="16" stroke="#2D414B" stroke-width="2"/>

  <!-- Screen bezel -->
  <rect x="295" y="165" width="310" height="250" fill="url(#screenGrad)" rx="10"/>

  <!-- Screen teal top accent bar -->
  <rect x="295" y="165" width="310" height="4" fill="#397A78" rx="2" opacity="0.9"/>

  <!-- Screen content: SENSOR READINGS display -->
  <!-- Header row -->
  <rect x="305" y="178" width="290" height="28" fill="#17252B" rx="6"/>
  <text x="320" y="197" fill="#D5A548" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">CONTINUOUS RADON MONITOR [ILLUSTRATIVE]</text>
  <circle cx="580" cy="192" r="5" fill="#D5A548">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Measurement circle / dial -->
  <circle cx="450" cy="280" r="72" fill="none" stroke="#2D414B" stroke-width="8"/>
  <circle cx="450" cy="280" r="72" fill="none" stroke="#397A78" stroke-width="5" stroke-dasharray="180,270" stroke-linecap="round" transform="rotate(-90 450 280)"/>
  <circle cx="450" cy="280" r="72" fill="none" stroke="#D5A548" stroke-width="3" stroke-dasharray="40,410" stroke-linecap="round" transform="rotate(-90 450 280)"/>
  <circle cx="450" cy="280" r="58" fill="#0F1E28" opacity="0.9"/>
  <!-- Center measurement text -->
  <text x="450" y="270" fill="#FFFFFF" font-family="monospace" font-size="12" text-anchor="middle">PROPERTY RESULT</text>
  <text x="450" y="290" fill="#D5A548" font-family="monospace" font-size="10" text-anchor="middle">ILLUSTRATIVE</text>

  <!-- Bottom stats row -->
  <rect x="305" y="360" width="86" height="46" fill="#0F1E28" rx="6"/>
  <text x="348" y="378" fill="#94A6AE" font-family="monospace" font-size="9" text-anchor="middle">PERIOD</text>
  <text x="348" y="397" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">48-HR CRM</text>

  <rect x="398" y="360" width="104" height="46" fill="#397A78" opacity="0.2" rx="6" stroke="#397A78" stroke-width="1"/>
  <text x="450" y="378" fill="#4D9694" font-family="monospace" font-size="9" text-anchor="middle">STATUS</text>
  <text x="450" y="397" fill="#4D9694" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">SAMPLING</text>

  <rect x="509" y="360" width="86" height="46" fill="#0F1E28" rx="6"/>
  <text x="552" y="378" fill="#94A6AE" font-family="monospace" font-size="9" text-anchor="middle">LOCATION</text>
  <text x="552" y="397" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">LOWEST LVL</text>

  <!-- Device bottom stand -->
  <rect x="390" y="460" width="120" height="12" fill="#17252B" rx="3"/>
  <rect x="370" y="470" width="160" height="8" fill="#0F1A22" rx="4"/>

  <!-- Side panel details (device buttons) -->
  <rect x="280" y="230" width="6" height="30" fill="#2D414B" rx="3"/>
  <rect x="280" y="270" width="6" height="20" fill="#2D414B" rx="3"/>
  <rect x="614" y="240" width="6" height="24" fill="#2D414B" rx="3"/>

  <!-- Data visualization lines floating left -->
  <g>
    <polyline points="60,350 100,310 140,330 180,290 220,300 260,260" fill="none" stroke="#397A78" stroke-width="2" stroke-linecap="round"/>
    <circle cx="260" cy="260" r="4" fill="#397A78"/>
    <polyline points="60,380 100,365 140,370 180,345 220,355 260,320" fill="none" stroke="#D5A548" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,4"/>
    <text x="100" y="430" fill="#647C82" font-family="monospace" font-size="11" text-anchor="middle">DATA LOG</text>
  </g>

  <!-- Data visualization lines floating right -->
  <g>
    <polyline points="640,320 680,300 720,315 760,285 800,295 840,260" fill="none" stroke="#4D9694" stroke-width="2" stroke-linecap="round"/>
    <circle cx="840" cy="260" r="4" fill="#4D9694"/>
    <polyline points="640,360 680,340 720,355 760,320 800,330 840,300" fill="none" stroke="#D5A548" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,4"/>
    <text x="740" y="430" fill="#647C82" font-family="monospace" font-size="11" text-anchor="middle">SENSOR LOG</text>
  </g>

  <!-- Corner measurement rings decoration -->
  <circle cx="80" cy="100" r="40" fill="none" stroke="#2D414B" stroke-width="1.5"/>
  <circle cx="80" cy="100" r="28" fill="none" stroke="#397A78" stroke-width="1" opacity="0.5"/>
  <circle cx="80" cy="100" r="6" fill="#D5A548" opacity="0.5"/>

  <circle cx="820" cy="500" r="40" fill="none" stroke="#2D414B" stroke-width="1.5"/>
  <circle cx="820" cy="500" r="28" fill="none" stroke="#397A78" stroke-width="1" opacity="0.5"/>
  <circle cx="820" cy="500" r="6" fill="#D5A548" opacity="0.5"/>

  <text x="450" y="565" fill="#FFFFFF" fill-opacity="0.15" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="4">RADENZA • RADON TESTING &amp; MEASUREMENT MONITOR</text>
</svg>
